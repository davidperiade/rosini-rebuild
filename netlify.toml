[build]
  command = "node build.mjs"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20.12.2"
  NPM_FLAGS = "--no-audit --no-fund"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/produse.html"
  to = "/produse-v2.html"
  status = 200

[[redirects]]
  from = "/produse"
  to = "/produse-v2.html"
  status = 200

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/site-data.json"
  [headers.values]
    Cache-Control = "no-store"
