[build]
  command = "node build.mjs"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20.12.2"
  NPM_FLAGS = "--no-audit --no-fund"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Serve the public homepage at the root without a browser redirect.
# This keeps / and /admin/ as separate entry points.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
  force = true

# Keep the CMS entry point available under /admin/.
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
  force = true

# The site code references this logo path; keep the exact Rosini SVG asset as the source of truth.
[[redirects]]
  from = "/content/images/rosini-logo.png"
  to = "/content/images/rosini.svg"
  status = 200
  force = true
