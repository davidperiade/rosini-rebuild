[build]
  command = "node build.mjs"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20.12.2"
  NPM_FLAGS = "--no-audit --no-fund"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Explicitly serve the public homepage without a redirect.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
  force = true

# Explicitly serve the CMS entry point without any redirect.
# This prevents /admin and /admin/ from entering a slash-normalization loop.
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200
  force = true

# The site code references this logo path; keep the exact Rosini SVG asset as the source of truth.
[[redirects]]
  from = "/content/images/rosini-logo.png"
  to = "/content/images/rosini.svg"
  status = 200
  force = true
