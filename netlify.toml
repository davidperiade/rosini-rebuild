[build]
  command = "node build.mjs"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20.12.2"
  NPM_FLAGS = "--no-audit --no-fund"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# The site code already references this logo path.
# Keep the exact Rosini SVG asset as the source of truth.
[[redirects]]
  from = "/content/images/rosini-logo.png"
  to = "/content/images/rosini.svg"
  status = 200
  force = true
