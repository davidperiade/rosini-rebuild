[build]
  command = "node build.mjs"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20.12.2"
  NPM_FLAGS = "--no-audit --no-fund"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# The root URL must always open the public Rosini website.
# Use a real redirect rather than a rewrite so the browser cannot remain
# on the Decap CMS route when navigating to the site root.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 301
  force = true

# Keep the CMS entry point available only under /admin/.
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
  force = true

# The site code already references this logo path.
# Keep the exact Rosini SVG asset as the source of truth.
[[redirects]]
  from = "/content/images/rosini-logo.png"
  to = "/content/images/rosini.svg"
  status = 200
  force = true
