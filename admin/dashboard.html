<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rosini — Panou administrare</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f3ef;color:#1d1b19}.wrap{max-width:1100px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:white;border:1px solid #ddd6cc;border-radius:14px;padding:18px}.stat{font-size:28px;font-weight:700}.actions{display:flex;gap:10px;flex-wrap:wrap}button,input{padding:10px 12px;border-radius:8px;border:1px solid #cfc7bd}button{cursor:pointer;background:#211f1d;color:white}.danger{background:#8d2d25}.muted{color:#6d655d}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #eee;padding:12px 0}
</style></head>
<body><main class="wrap"><div class="top"><div><h1>Panou Rosini</h1><p class="muted" id="who">Se verifică autentificarea…</p></div><div class="actions"><a href="/admin/">CMS</a><button id="logout">Deconectare</button></div></div>
<section><h2>Statistici — ultimele 30 zile</h2><div class="grid" id="stats"></div></section>
<section><h2>Administratori</h2><div class="card"><div id="users">Se încarcă…</div><h3>Adaugă administrator</h3><div class="actions"><input id="newEmail" type="email" placeholder="email"><input id="newPassword" type="password" placeholder="parolă, minimum 10 caractere"><button id="add">Adaugă</button></div></div></section>
<section><h2>Schimbă parola</h2><div class="card"><p class="muted">Schimbarea parolei este aplicată contului autentificat prin Netlify Identity.</p><div class="actions"><input id="password" type="password" placeholder="parolă nouă"><button id="change">Schimbă parola</button></div></div></section>
</main><script>
const $=id=>document.getElementById(id);const fmt=s=>s?`${Math.floor(s/60)}m ${s%60}s`:'0s';
function renderStats(x){$('stats').innerHTML=[['Vizualizări pagini',x.pageViews],['Clickuri telefon',x.phoneClicks],['Clickuri WhatsApp',x.whatsappClicks],['Clickuri email',x.emailClicks],['Clickuri CTA',x.ctaClicks],['Formulare trimise',x.contactSubmits],['Timp mediu',fmt(x.averageEngagementSeconds)]].map(([a,b])=>`<div class="card"><div class="muted">${a}</div><div class="stat">${b}</div></div>`).join('')}
async function load(){const u=netlifyIdentity.currentUser();if(!u){netlifyIdentity.open();return}$('who').textContent=`Autentificat: ${u.email}`;const [s,r]=await Promise.all([fetch('/api/analytics-stats'),fetch('/api/admin-users')]);if(s.ok)renderStats(await s.json());if(r.ok){const d=await r.json();$('users').innerHTML=d.users.map(x=>`<div class="row"><div><strong>${x.email}</strong><div class="muted">${x.confirmed?'Activ':'Neconfirmat'} · ultimul login: ${x.lastLogin||'—'}</div></div><button class="danger" data-id="${x.id}" ${d.users.length<=1?'disabled':''}>Șterge</button></div>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(!confirm('Ștergi administratorul?'))return;const q=await fetch('/api/admin-users',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:b.dataset.id})});alert(q.ok?'Administrator șters.':await q.text());if(q.ok)load()})}}
$('add').onclick=async()=>{const email=$('newEmail').value,password=$('newPassword').value;const q=await fetch('/api/admin-users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});alert(q.ok?'Administrator adăugat.':await q.text());if(q.ok)load()};
$('change').onclick=async()=>{const p=$('password').value;if(p.length<10)return alert('Parola trebuie să aibă minimum 10 caractere.');const u=netlifyIdentity.currentUser();try{await u.update({password:p});alert('Parola a fost schimbată.')}catch(e){alert(e.message)}};
$('logout').onclick=()=>netlifyIdentity.logout();netlifyIdentity.on('init',load);netlifyIdentity.on('login',load);netlifyIdentity.on('logout',()=>location.reload());
</script></body></html>
