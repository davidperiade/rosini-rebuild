<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Rosini — Administrare</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    #rosini-profile-link,#rosini-leads-link{position:fixed;right:18px;z-index:999999;color:#fff;text-decoration:none;padding:12px 16px;border-radius:999px;font:700 13px/1 system-ui,-apple-system,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.18)}
    #rosini-profile-link{bottom:18px;background:#171717}
    #rosini-leads-link{bottom:66px;background:#a21c1c}
    #rosini-profile-link:hover{background:#333}
    #rosini-leads-link:hover{background:#7f1515}
  </style>
</head>
<body>
  <div style="font-family:system-ui,sans-serif;padding:24px">Se încarcă panoul de administrare Rosini…</div>
  <script>
    window.netlifyIdentity = window.netlifyIdentity || [];
    window.netlifyIdentity.on('init', function () {
      if (window.location.hash && window.location.hash.includes('invite_token')) window.netlifyIdentity.open('signup');
      const addLinks = () => {
        const user = window.netlifyIdentity.currentUser && window.netlifyIdentity.currentUser();
        if (!user) return;
        if (!document.getElementById('rosini-profile-link')) {
          const a = document.createElement('a'); a.id='rosini-profile-link'; a.href='/admin/profil.html'; a.textContent='Profil · Administratori'; a.title='Profil și gestionarea administratorilor'; document.body.appendChild(a);
        }
        if (!document.getElementById('rosini-leads-link')) {
          const a = document.createElement('a'); a.id='rosini-leads-link'; a.href='/admin/leaduri.html'; a.textContent='Leaduri · Recenzii'; a.title='Colectare leaduri și moderare recenzii'; document.body.appendChild(a);
        }
      };
      addLinks();
      window.netlifyIdentity.on('login', addLinks);
    });
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
