backend:
  name: git-gateway
  branch: main
media_folder: content/images
public_folder: /content/images
site_url: /
collections:
  - name: products
    label: Produse
    folder: content/products
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{title}} — {{category}}'
    fields:
      - {label: Nume produs, name: title, widget: string}
      - {label: Categorie, name: category, widget: relation, collection: categories, search_fields: [title], value_field: title, display_fields: [title]}
      - {label: Fotografie principală, name: image, widget: image, required: false}
      - label: Fotografii suplimentare
        name: gallery
        widget: list
        required: false
        field: {label: Fotografie, name: image, widget: image}
      - label: Dimensiuni produs
        name: dimensions
        widget: object
        required: false
        fields:
          - {label: Lățime, name: width, widget: string, required: false}
          - {label: Adâncime, name: depth, widget: string, required: false}
          - {label: Înălțime, name: height, widget: string, required: false}
          - {label: Înălțime șezut, name: seat_height, widget: string, required: false}
          - {label: Lungime extinsă, name: extended_length, widget: string, required: false}
      - {label: Descriere produs, name: description, widget: text, required: false}
      - label: Caracteristici
        name: features
        widget: list
        required: false
        field: {label: Caracteristică, name: item, widget: string}
      - {label: Termen de livrare, name: delivery_time, widget: string, required: false}
      - {label: Garanție, name: warranty, widget: string, required: false}
      - {label: Detalii suplimentare, name: body, widget: markdown, required: false}
  - name: categories
    label: Categorii
    folder: content/categories
    create: true
    delete: true
    slug: '{{slug}}'
    fields:
      - {label: Titlu categorie, name: title, widget: string}
      - {label: Slug, name: slug, widget: string}
      - {label: Imagine categorie, name: image, widget: image, required: false}
      - {label: Descriere, name: description, widget: text, required: false}
  - name: factory
    label: Fotografii din fabrică
    folder: content/factory
    create: true
    delete: true
    slug: '{{slug}}'
    fields:
      - {label: Titlu, name: title, widget: string}
      - {label: Imagine, name: image, widget: image}
      - {label: Descriere, name: description, widget: text, required: false}
      - {label: Conținut, name: body, widget: markdown, required: false}
  - name: site_settings
    label: Setări site
    files:
      - label: Setări generale
        name: general
        file: content/site-settings.md
        fields:
          - {label: Logo, name: logo, widget: image, required: false}
          - {label: Imagine informativă prima pagină, name: hero_image, widget: image, required: false, hint: 'Imaginea principală afișată în partea de sus a paginii Acasă.'}
          - {label: Telefon pentru apel, name: phone_primary, widget: string}
          - {label: Număr WhatsApp, name: whatsapp_phone, widget: string}
          - {label: Mesaj prestabilit WhatsApp, name: whatsapp_message, widget: text, required: false}
          - {label: Afișează caseta Apel, name: show_call_button, widget: boolean, default: true}
          - {label: Afișează caseta WhatsApp, name: show_whatsapp_button, widget: boolean, default: true}
          - {label: Email, name: email, widget: string}
          - {label: Adresă, name: address, widget: string}
          - {label: Garanție luni, name: warranty_months, widget: number, value_type: int}
          - {label: Livrare săptămâni, name: delivery_weeks, widget: number, value_type: int}
          - {label: Facebook, name: facebook_url, widget: string, required: false}
          - {label: Instagram, name: instagram_url, widget: string, required: false}
          - {label: TikTok, name: tiktok_url, widget: string, required: false}
