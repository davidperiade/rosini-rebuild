backend:
  name: git-gateway
  branch: main
media_folder: content/images
public_folder: /content/images
site_url: /
collections:
  - name: products
    label: Produse
    folder: content/products
    create: true
    delete: true
    slug: '{{slug}}'
    fields:
      - {label: Titlu, name: title, widget: string}
      - {label: Slug, name: slug, widget: string}
      - {label: Categorie, name: category, widget: string}
      - {label: Descriere, name: description, widget: text}
      - {label: Caracteristici, name: features, widget: list}
      - {label: Livrare, name: delivery_time, widget: string}
      - {label: Garanție, name: warranty, widget: string}
      - {label: Imagine principală, name: image, widget: image, required: false}
      - label: Galerie foto produs
        name: gallery
        widget: list
        required: false
        field: {label: Fotografie, name: image, widget: image}
        hint: 'Adaugă oricâte fotografii dorești pentru același produs.'
      - label: Configurații produs
        name: configuration_options
        widget: list
        required: false
        hint: 'Format: Etichetă: opțiune 1 | opțiune 2 | opțiune 3'
      - label: Imagini 360°
        name: gallery_360
        widget: list
        required: false
        field: {label: Imagine, name: image, widget: image}
        hint: 'Încarcă imaginile în ordinea rotației, ideal 24–36 cadre.'
      - {label: Activare Vezi în camera ta cu AI, name: ai_room_preview, widget: boolean, default: true, required: false}
      - {label: Conținut, name: body, widget: markdown}
  - name: portfolio
    label: Portofoliu
    folder: content/portfolio
    create: true
    delete: true
    slug: '{{slug}}'
    fields:
      - {label: Titlu, name: title, widget: string}
      - {label: Slug, name: slug, widget: string}
      - {label: Categorie, name: category, widget: string}
      - {label: Imagine, name: image, widget: image}
      - {label: Descriere, name: description, widget: text}
      - {label: Conținut, name: body, widget: markdown}
  - name: factory
    label: Din fabrică
    folder: content/factory
    create: true
    delete: true
    slug: '{{slug}}'
    fields:
      - {label: Titlu, name: title, widget: string}
      - {label: Categorie, name: category, widget: string, required: false}
      - {label: Fotografie, name: image, widget: image}
      - {label: Descriere, name: description, widget: text, required: false}
      - {label: Data, name: date, widget: datetime, required: false}
      - {label: Conținut, name: body, widget: markdown, required: false}
  - name: testimonials
    label: Recenzii
    folder: content/testimonials
    create: true
    delete: true
    slug: '{{slug}}'
    fields:
      - {label: Titlu, name: title, widget: string}
      - {label: Autor, name: author, widget: string}
      - {label: Rating, name: rating, widget: number, value_type: int, min: 1, max: 5}
      - {label: Data, name: date, widget: datetime}
      - {label: Text, name: body, widget: markdown}
  - name: site_settings
    label: Setări site
    files:
      - label: Setări generale
        name: general
        file: content/site-settings.md
        fields:
          - {label: Logo site, name: logo, widget: image, required: false}
          - {label: Telefon principal, name: phone_primary, widget: string, required: false}
          - {label: Telefon secundar, name: phone_secondary, widget: string, required: false}
          - {label: Email, name: email, widget: string}
          - {label: Adresă, name: address, widget: string}
          - {label: Program, name: business_hours, widget: string, required: false}
          - {label: Facebook, name: facebook_url, widget: string, required: false}
          - {label: Instagram, name: instagram_url, widget: string, required: false}
          - {label: TikTok, name: tiktok_url, widget: string, required: false}
          - {label: Garanție luni, name: warranty_months, widget: number, value_type: int}
          - {label: Livrare săptămâni, name: delivery_weeks, widget: number, value_type: int}
